# yaml-language-server: $schema=https://raw.githubusercontent.com/vdawg-git/moo/refs/heads/master/other/schemas/mooPlaylist.json

name: Dark ambient

rules:
  - any: 
      - mood:
          includes:
            - "dark"
            - "nocturnal"
            - "night"
  - all:
      - genre:
          includes:
            - ambient
